name: Sync with upstream

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: beyond-all-reason/teiserver
  SYNC_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes gh

      - name: Sync branch from upstream
        run: gh repo sync "${GITHUB_REPOSITORY}" -s "${UPSTREAM_REPOSITORY}" -b "${SYNC_BRANCH}"
